<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HR Management Software Nepal | Sprasa HR</title>
    <meta name="description" content="Manage employees, attendance, leave, payroll and HR reports with Sprasa HR, a practical HR management system built for Nepali organisations." />
    <meta name="theme-color" content="#0F766E" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sprasa HR" />
    <meta property="og:title" content="HR Management Software Nepal | Sprasa HR" />
    <meta property="og:description" content="Employee records, attendance, leave, payroll and reporting in one system built for Nepali organisations." />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('sprasa-theme');
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Sprasa HR needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
