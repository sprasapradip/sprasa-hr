<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Sprasa HR thumbnail</title>
<style>
  @font-face { font-family: 'Montserrat'; src: url('/assets/fonts/Montserrat.ttf') format('truetype'); font-weight: 100 900; }
  @font-face { font-family: 'Jost'; src: url('/assets/fonts/Jost.ttf') format('truetype'); font-weight: 100 900; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; }
  body { position: relative; color: #fff; font-family: 'Jost', sans-serif;
    background: radial-gradient(700px 500px at 15% 20%, rgba(29,87,184,.75), transparent 70%),
                radial-gradient(600px 500px at 90% 90%, rgba(107,63,184,.6), transparent 70%),
                linear-gradient(150deg, #000C24, #00173D 60%, #000C24); }
  .grid { position: absolute; inset: 0; opacity: .08; background-image: linear-gradient(rgba(143,176,230,.8) 1px, transparent 1px), linear-gradient(90deg, rgba(143,176,230,.8) 1px, transparent 1px); background-size: 48px 48px; }
  .shot { position: absolute; right: -250px; top: 175px; width: 820px; border-radius: 14px; overflow: hidden; transform: perspective(1400px) rotateY(-18deg) rotateX(6deg) rotateZ(-2deg);
    box-shadow: 0 40px 90px rgba(0,0,0,.7), 0 0 0 2px rgba(143,176,230,.5), 0 0 60px rgba(123,63,196,.5); }
  .shot .bar { height: 30px; background: #0B1736; display: flex; align-items: center; gap: 7px; padding: 0 12px; }
  .shot .bar i { width: 10px; height: 10px; border-radius: 50%; } .shot .bar i:nth-child(1) { background: #ff5f57; } .shot .bar i:nth-child(2) { background: #febc2e; } .shot .bar i:nth-child(3) { background: #28c840; }
  .shot img { display: block; width: 100%; }
  .left { z-index: 2; position: absolute; left: 64px; top: 64px; width: 700px; }
  .card { width: 132px; height: 132px; border-radius: 30px; overflow: hidden; box-shadow: 0 25px 50px rgba(0,0,0,.55), 0 0 0 2px rgba(255,255,255,.4); }
  .card img { width: 100%; height: 100%; object-fit: cover; }
  h1 { font: 900 98px/0.98 'Montserrat'; letter-spacing: -3px; margin-top: 28px; white-space: nowrap; text-shadow: 0 8px 30px rgba(0,0,0,.5); }
  h1 span { display: block; background: linear-gradient(110deg, #8FB0E6, #C4B5FD); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .pill { display: inline-block; margin-top: 26px; padding: 12px 26px; border-radius: 999px; font: 700 30px 'Montserrat'; color: #001F52; background: linear-gradient(135deg, #fff, #C3D4F0); box-shadow: 0 14px 30px rgba(0,0,0,.4); }
  .sub { font: 500 26px 'Jost'; color: #C3D4F0; margin-top: 20px; }
  .sts { position: absolute; right: 40px; top: 34px; height: 46px; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="shot"><div class="bar"><i></i><i></i><i></i></div><img src="/shots/tour/dash.png" alt=""></div>
  <img class="sts" src="/assets/sts-logo-white.png" alt="">
  <div class="left">
    <div class="card"><img src="/assets/hr-logo.jpg" alt=""></div>
    <h1>SPRASA HR<span>FULL DEMO</span></h1>
    <div class="pill">HR + Payroll Software</div>
    <div class="sub">Built for Nepali organisations</div>
  </div>
</body>
</html>
