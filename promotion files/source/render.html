<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Sprasa HR promo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --teal: #0f766e; --teal-2: #0ea5a4; --teal-3: #5eead4; --ink: #042f2e; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; }
  body { font-family: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif; color: #fff; position: relative;
    background: radial-gradient(1200px 800px at 20% 10%, #12807a 0%, transparent 60%),
                radial-gradient(1000px 700px at 85% 90%, #0b5d58 0%, transparent 60%),
                linear-gradient(135deg, #032b29 0%, #06403c 50%, #021f1e 100%); }
  .grid { position: absolute; inset: 0; opacity: .10;
    background-image: linear-gradient(rgba(255,255,255,.5) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.5) 1px, transparent 1px);
    background-size: 64px 64px; -webkit-mask-image: radial-gradient(ellipse at center, #000 30%, transparent 75%); }
  .orb { position: absolute; border-radius: 50%; filter: blur(60px); opacity: .45; }
  #orbA { width: 520px; height: 520px; left: -120px; top: 520px; background: #14b8a6; }
  #orbB { width: 460px; height: 460px; right: -100px; top: -120px; background: #0d9488; }

  #intro { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; z-index: 5; }
  #intro .mark { width: 150px; height: 150px; filter: drop-shadow(0 30px 60px rgba(0,0,0,.45)); }
  #intro .word { font-size: 92px; font-weight: 700; letter-spacing: -2px; }
  #intro .word span { color: var(--teal-3); }
  #intro .tag { font-size: 34px; color: #b6f0e6; }

  #win { position: absolute; left: 140px; top: 36px; width: 1640px; height: 890px; z-index: 3; border-radius: 16px; overflow: hidden; background: #fff;
    box-shadow: 0 50px 120px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.08); display: flex; flex-direction: column; transform-origin: 50% 40%; }
  .tabs { height: 44px; flex: none; background: #dfe3e8; display: flex; align-items: flex-end; padding: 0 12px; gap: 8px; }
  .dots { display: flex; gap: 8px; align-self: center; margin-right: 14px; }
  .dots i { width: 13px; height: 13px; border-radius: 50%; display: block; }
  .dots i:nth-child(1) { background: #ff5f57; } .dots i:nth-child(2) { background: #febc2e; } .dots i:nth-child(3) { background: #28c840; }
  .tab { height: 36px; width: 270px; background: #fff; border-radius: 10px 10px 0 0; display: flex; align-items: center; gap: 10px; padding: 0 14px; font-size: 14px; color: #333; }
  .tab svg { width: 18px; height: 18px; flex: none; }
  .tab .x { margin-left: auto; color: #888; font-size: 16px; }
  .tab.new { width: auto; background: transparent; color: #666; font-size: 22px; padding: 0 10px; }
  .bar { height: 50px; flex: none; background: #fff; display: flex; align-items: center; gap: 14px; padding: 0 16px; border-bottom: 1px solid #e6e8eb; }
  .nav { display: flex; gap: 16px; color: #666; }
  .nav svg { width: 18px; height: 18px; }
  .omni { flex: 1; height: 34px; background: #f1f3f4; border-radius: 17px; display: flex; align-items: center; gap: 10px; padding: 0 16px; font-size: 15px; color: #202124; }
  .omni svg { width: 15px; height: 15px; color: #5f6368; }
  .omni.focus { background: #fff; box-shadow: 0 0 0 2px #1a73e8; }
  .caret { display: inline-block; width: 1.5px; height: 18px; background: #1a73e8; vertical-align: -3px; margin-left: 1px; }
  .muted { color: #5f6368; }
  .view { position: relative; width: 1640px; height: 796px; overflow: hidden; background: #fff; }
  #zoom { position: absolute; inset: 0; transform-origin: 0 0; }
  #zoom img { position: absolute; left: 0; top: 0; width: 1640px; height: 796px; }
  #newtab { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; padding-top: 230px; gap: 44px; background: #fff; }
  #newtab .search { width: 640px; height: 54px; border-radius: 27px; border: 1px solid #dfe1e5; box-shadow: 0 1px 6px rgba(32,33,36,.18); display: flex; align-items: center; gap: 14px; padding: 0 22px; color: #9aa0a6; font-size: 17px; }
  #newtab .search svg { width: 20px; height: 20px; }
  #newtab .tiles { display: flex; gap: 34px; }
  #newtab .tile { width: 88px; display: flex; flex-direction: column; align-items: center; gap: 10px; font-size: 13px; color: #3c4043; }
  #newtab .tile i { width: 52px; height: 52px; border-radius: 50%; background: #f1f3f4; display: grid; place-items: center; font-style: normal; font-weight: 600; color: #5f6368; font-size: 18px; }
  #loadbar { position: absolute; left: 0; top: 0; height: 3px; background: #1a73e8; z-index: 2; }
  #hl { position: absolute; border-radius: 10px; border: 3px solid #14b8a6; box-shadow: 0 0 0 6px rgba(20,184,166,.25); z-index: 3; }
  #cursor { position: absolute; width: 30px; height: 30px; z-index: 9; filter: drop-shadow(0 3px 6px rgba(0,0,0,.35)); transform-origin: 4px 3px; }
  .ripple { position: absolute; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; border: 3px solid var(--teal-2); z-index: 8; }

  #caption { position: absolute; left: 960px; top: 1003px; z-index: 6; display: flex; align-items: center; gap: 16px; padding: 14px 30px 14px 14px; border-radius: 999px;
    background: rgba(4, 47, 46, .92); box-shadow: 0 20px 50px rgba(0,0,0,.4), inset 0 0 0 1px rgba(94,234,212,.3); white-space: nowrap; }
  #caption .step { width: 42px; height: 42px; border-radius: 50%; background: linear-gradient(135deg, var(--teal-2), var(--teal)); display: grid; place-items: center; font-weight: 700; font-size: 20px; }
  #caption .txt { font-size: 28px; font-weight: 600; letter-spacing: -.2px; }
  #caption .txt b { color: var(--teal-3); font-weight: 600; }

  #outro { position: absolute; inset: 0; z-index: 7; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 40px; }
  #outro .head { font-size: 68px; font-weight: 700; letter-spacing: -1.5px; text-align: center; line-height: 1.12; text-shadow: 0 10px 40px rgba(0,0,0,.4); }
  #outro .head span { color: var(--teal-3); }
  .chips { display: flex; gap: 20px; }
  .chip { display: flex; align-items: center; gap: 14px; padding: 18px 26px; border-radius: 18px; background: rgba(4,47,46,.55);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.18); font-size: 26px; font-weight: 500; }
  .chip svg { width: 30px; height: 30px; color: var(--teal-3); }
  .lock { display: flex; align-items: center; gap: 20px; }
  .lock svg { width: 76px; height: 76px; }
  .lock .n { font-size: 48px; font-weight: 700; letter-spacing: -1px; line-height: 1; }
  .lock .by { font-size: 20px; color: #b6f0e6; margin-top: 6px; }
  .cta { padding: 22px 46px; border-radius: 999px; font-size: 30px; font-weight: 600; color: var(--ink); background: linear-gradient(135deg, #99f6e4, #2dd4bf); }
  #shade { position: absolute; inset: 0; z-index: 4; background: radial-gradient(ellipse at center, rgba(2,31,30,.55), rgba(2,31,30,.85)); }
</style>
</head>
<body>
  <div class="grid"></div><div class="orb" id="orbA"></div><div class="orb" id="orbB"></div>

  <div id="intro">
    <svg class="mark" id="iMark" viewBox="0 0 32 32"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#0f766e" stop-opacity="0"/></linearGradient></defs><rect width="32" height="32" rx="7" fill="#0F766E"/><rect width="32" height="32" rx="7" fill="url(#g)" opacity=".6"/><path d="M10 20.5c1.4 1.3 3.3 2 5.6 2 3 0 5-1.5 5-3.8 0-5-9.4-2.9-9.4-7.3 0-1.7 1.6-2.9 4-2.9 1.8 0 3.3.6 4.4 1.6" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></svg>
    <div class="word" id="iWord">Sprasa <span>HR</span></div>
    <div class="tag" id="iTag">Leave, attendance &amp; payroll — beautifully simple.</div>
  </div>

  <div id="win">
    <div class="tabs">
      <div class="dots"><i></i><i></i><i></i></div>
      <div class="tab"><svg id="globe" viewBox="0 0 24 24" fill="none" stroke="#5f6368" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg><svg id="fav" viewBox="0 0 32 32"><rect width="32" height="32" rx="7" fill="#0F766E"/><path d="M10 20.5c1.4 1.3 3.3 2 5.6 2 3 0 5-1.5 5-3.8 0-5-9.4-2.9-9.4-7.3 0-1.7 1.6-2.9 4-2.9 1.8 0 3.3.6 4.4 1.6" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></svg><span id="tabtitle">New Tab</span><span class="x">×</span></div>
      <div class="tab new">+</div>
    </div>
    <div class="bar">
      <div class="nav">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" opacity=".4"><path d="M9 18l6-6-6-6"/></svg>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/></svg>
      </div>
      <div class="omni" id="omni">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        <span id="url"></span>
      </div>
    </div>
    <div class="view">
      <div id="newtab"><div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>Search or type a URL</div>
        <div class="tiles"><div class="tile"><i>M</i>Mail</div><div class="tile"><i>C</i>Calendar</div><div class="tile"><i>D</i>Drive</div><div class="tile"><i>N</i>News</div><div class="tile"><i>+</i>Add shortcut</div></div></div>
      <div id="loadbar"></div>
      <div id="zoom"><img id="imgA" alt=""><img id="imgB" alt=""></div>
      <div id="hl"></div>
      <div id="ripples"></div>
      <svg id="cursor" viewBox="0 0 24 24"><path d="M4 2.5l15.5 9.2-6.8 1.5 3.9 7.3-2.9 1.5-3.9-7.3L4.9 19z" fill="#111" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>
    </div>
  </div>

  <div id="shade"></div>
  <div id="caption"><div class="step" id="capstep">1</div><div class="txt" id="captxt"></div></div>

  <div id="outro">
    <div class="head" id="oHead">One simple system for<br><span>your whole HR team.</span></div>
    <div class="chips">
      <div class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Attendance</div>
      <div class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 16l20-8-8 14-2-6z"/></svg>Leave</div>
      <div class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="13" rx="2"/><circle cx="12" cy="12.5" r="2.5"/><path d="M6 9.5h.01M18 15.5h.01"/></svg>Payroll</div>
      <div class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Self-service</div>
    </div>
    <div class="lock" id="oLock">
      <svg viewBox="0 0 32 32"><rect width="32" height="32" rx="7" fill="#0F766E"/><path d="M10 20.5c1.4 1.3 3.3 2 5.6 2 3 0 5-1.5 5-3.8 0-5-9.4-2.9-9.4-7.3 0-1.7 1.6-2.9 4-2.9 1.8 0 3.3.6 4.4 1.6" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></svg>
      <div><div class="n">Sprasa HR</div><div class="by">by Sprasa Technical Solution</div></div>
    </div>
    <div class="cta" id="oCta">Book your demo today</div>
  </div>

<script>
// ---------- helpers ----------
const $ = (id) => document.getElementById(id);
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, p) => a + (b - a) * p;
const easeOut = (p) => 1 - Math.pow(1 - clamp(p), 3);
const easeInOut = (p) => { p = clamp(p); return p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2; };
const backOut = (p) => { p = clamp(p); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); };
const prog = (t, start, dur) => clamp((t - start) / dur);

// ---------- timeline (filled by setup) ----------
let TL;
window.setup = async (data) => {
  const { targets: G, reasonSteps } = data;
  const shots = [];          // [t, name, fadeDuration]
  const add = (t, name, fade = 0) => shots.push([t, name, fade]);
  add(0, null);
  add(4.15, 'login', .25);
  for (let i = 1; i <= 8; i++) add(4.95 + i * .055, `user${i}`);
  for (let i = 1; i <= 11; i++) add(5.75 + i * .045, `pass${i}`);
  add(6.85, 'dash', .22);
  add(8.35, 'leave', .22);
  add(9.2, 'dialog', .18);
  add(10.2, 'select', .12);
  add(11.15, 'from');
  add(11.8, 'to');
  for (let k = 1; k <= reasonSteps; k++) add(12.35 + k * .075, `reason${k}`);
  add(14.05, 'result', .22);

  const P = (g, dx = 0, dy = 0) => ({ x: g.x + dx, y: g.y + dy });
  const moves = [ // [t0, t1, target]
    [4.3, 4.8, P(G.user, -110, 4)], [5.25, 5.65, P(G.pass, -110, 4)], [6.15, 6.6, P(G.signin, 10, 6)],
    [7.5, 8.05, P(G.myleave, -30, 4)], [8.5, 8.95, P(G.apply, 0, 6)],
    [9.6, 10.05, P(G.select, -100, 4)], [10.6, 11.0, P(G.from, -40, 4)], [11.3, 11.7, P(G.to, -40, 4)],
    [11.85, 12.25, P(G.reason, -120, -10)], [13.35, 13.8, P(G.submit, 0, 6)],
    [14.6, 15.2, P(G.newrow, -260, 8)],
  ];
  const clicks = [4.85, 5.7, 6.65, 8.1, 9.0, 10.1, 11.05, 11.75, 12.3, 13.85];
  const captions = [
    [3.1, 1, 'Open <b>Sprasa HR</b> in any browser'],
    [5.0, 2, 'Employees sign in <b>securely</b>'],
    [8.3, 3, 'Apply for leave in <b>a few clicks</b>'],
    [10.35, 4, 'Leave balance <b>checked instantly</b>'],
    [14.15, 5, 'Sent to the manager <b>for approval</b>'],
    [15.45, 0, null],
  ];
  const zoom = { in: [9.35, 10.05], out: [13.95, 14.65], s: 1.16, ox: G.dialog.x, oy: G.dialog.y + 10 };
  TL = { shots, moves, clicks, captions, zoom, G, start: { x: 900, y: 640 } };

  // preload
  const names = shots.map((s) => s[1]).filter(Boolean);
  window.imgs = {};
  await Promise.all(names.map((n) => new Promise((res, rej) => { const im = new Image(); im.onload = () => im.decode().then(res, res); im.onerror = rej; im.src = `/__promo/shots/${n}.png`; window.imgs[n] = im; })));
  await document.fonts.ready;
  return names.length;
};

// zoom transform at time t: returns scale & origin
function zoomAt(t) {
  const z = TL.zoom;
  const s = t < z.out[0] ? lerp(1, z.s, easeInOut(prog(t, z.in[0], z.in[1] - z.in[0]))) : lerp(z.s, 1, easeInOut(prog(t, z.out[0], z.out[1] - z.out[0])));
  return { s, ox: z.ox, oy: z.oy };
}
const mapPt = (p, z) => ({ x: z.ox + (p.x - z.ox) * z.s, y: z.oy + (p.y - z.oy) * z.s });

function cursorAt(t) {
  let pos = TL.start;
  for (const [t0, t1, to] of TL.moves) {
    if (t >= t1) { pos = to; continue; }
    if (t > t0) { const p = easeInOut((t - t0) / (t1 - t0)); return { x: lerp(pos.x, to.x, p), y: lerp(pos.y, to.y, p) + Math.sin(p * Math.PI) * -18 }; }
    break;
  }
  return pos;
}

let lastA = null, lastB = null;
function setImg(el, name) { if (el._n !== name) { el._n = name; el.src = name ? window.imgs[name].src : ''; el.style.visibility = name ? 'visible' : 'hidden'; } }

window.render = (t) => {
  // background drift
  $('orbA').style.transform = `translate(${Math.sin(t * .5) * 60}px, ${Math.cos(t * .4) * -40}px) scale(${1 + Math.sin(t * .3) * .08})`;
  $('orbB').style.transform = `translate(${Math.cos(t * .45) * -50}px, ${Math.sin(t * .35) * 40}px)`;

  // intro
  const pm = prog(t, 0, .9), pw = prog(t, .25, .8), pt = prog(t, .5, .8), po = easeInOut(prog(t, 2.0, .6));
  const ms = pm < .6 ? lerp(.4, 1.08, easeOut(pm / .6)) : lerp(1.08, 1, easeOut((pm - .6) / .4));
  $('iMark').style.opacity = clamp(pm * 2.5);
  $('iMark').style.transform = `scale(${ms}) rotate(${lerp(-12, 0, easeOut(pm))}deg)`;
  $('iWord').style.opacity = easeOut(pw); $('iWord').style.transform = `translateY(${lerp(24, 0, easeOut(pw))}px)`;
  $('iTag').style.opacity = easeOut(pt); $('iTag').style.transform = `translateY(${lerp(20, 0, easeOut(pt))}px)`;
  $('intro').style.opacity = 1 - po;
  $('intro').style.transform = `translateY(${-60 * po}px) scale(${1 - .06 * po})`;
  $('intro').style.display = po >= 1 ? 'none' : 'flex';

  // window in / outro recede
  const wi = easeOut(prog(t, 2.2, .9));
  const wo = easeInOut(prog(t, 15.55, .85));
  $('win').style.opacity = wi * (1 - .35 * wo);
  $('win').style.transform = `translateY(${lerp(140, 0, wi) + 30 * wo}px) scale(${lerp(.9, 1, wi) * (1 - .12 * wo)})`;
  $('win').style.filter = wo > 0 ? `blur(${9 * wo}px)` : 'none';
  $('shade').style.opacity = wo;

  // address bar
  const url = 'hr.yourcompany.com';
  const typed = Math.floor(clamp((t - 3.15) / .7) * url.length);
  const caretOn = Math.floor(t * 2) % 2 === 0;
  if (t < 3.0) { $('url').innerHTML = '<span class="muted">Search Google or type a URL</span>'; $('omni').classList.remove('focus'); }
  else if (t < 3.95) { $('url').innerHTML = url.slice(0, typed) + (caretOn || typed < url.length ? '<span class="caret"></span>' : ''); $('omni').classList.add('focus'); }
  else { const path = t < 6.85 ? '/login' : t < 8.35 ? '/app' : '/app/me/leave'; $('url').innerHTML = `${url}<span class="muted">${path}</span>`; $('omni').classList.remove('focus'); }
  const lb = prog(t, 3.95, .45);
  $('loadbar').style.width = (lb < .6 ? lerp(0, 70, easeOut(lb / .6)) : lerp(70, 100, (lb - .6) / .4)) + '%';
  $('loadbar').style.opacity = t < 3.95 ? 0 : 1 - prog(t, 4.4, .2);
  $('newtab').style.display = t < 4.45 ? 'flex' : 'none';
  $('globe').style.display = t < 4.15 ? 'block' : 'none';
  $('fav').style.display = t < 4.15 ? 'none' : 'block';
  $('tabtitle').textContent = t < 4.15 ? 'New Tab' : t < 6.85 ? 'Sign in · Sprasa HR' : t < 8.35 ? 'Dashboard · Sprasa HR' : 'My leave · Sprasa HR';

  // app screenshot (with cross-fade on page changes)
  let cur = 0;
  for (let i = 0; i < TL.shots.length; i++) if (t >= TL.shots[i][0]) cur = i;
  const [st, sname, fade] = TL.shots[cur];
  const prev = cur > 0 ? TL.shots[cur - 1][1] : null;
  const f = fade ? clamp((t - st) / fade) : 1;
  setImg($('imgA'), f < 1 ? prev : null);
  setImg($('imgB'), sname);
  $('imgB').style.opacity = easeOut(f);

  // zoom
  const z = zoomAt(t);
  $('zoom').style.transform = `translate(${z.ox}px, ${z.oy}px) scale(${z.s}) translate(${-z.ox}px, ${-z.oy}px)`;

  // cursor
  const c = mapPt(cursorAt(t), z);
  const cv = clamp((t - 4.2) / .25) * (1 - clamp((t - 15.4) / .25));
  let press = 1;
  for (const tc of TL.clicks) { const d = t - tc; if (d >= 0 && d < .2) press = 1 - .18 * Math.sin((d / .2) * Math.PI); }
  $('cursor').style.left = c.x - 4 + 'px'; $('cursor').style.top = c.y - 3 + 'px';
  $('cursor').style.opacity = cv; $('cursor').style.transform = `scale(${press})`;

  // ripples
  let html = '';
  for (let i = 0; i < TL.clicks.length; i++) {
    const tc = TL.clicks[i], d = t - tc;
    if (d < 0 || d > .6) continue;
    const p = cursorAt(tc), m = mapPt(p, zoomAt(tc));
    html += `<div class="ripple" style="left:${m.x}px;top:${m.y}px;transform:scale(${lerp(.4, 4, easeOut(d / .6))});opacity:${1 - d / .6}"></div>`;
  }
  $('ripples').innerHTML = html;

  // highlight the new request row
  const G = TL.G, hv = clamp((t - 14.55) / .3) * (1 - clamp((t - 15.5) / .25));
  $('hl').style.left = G.newrow.x - G.newrow.w / 2 - 6 + 'px'; $('hl').style.top = G.newrow.y - G.newrow.h / 2 - 4 + 'px';
  $('hl').style.width = G.newrow.w + 12 + 'px'; $('hl').style.height = G.newrow.h + 8 + 'px';
  $('hl').style.opacity = hv * (.75 + .25 * Math.sin(t * 9));

  // caption
  let ci = -1;
  for (let i = 0; i < TL.captions.length; i++) if (t >= TL.captions[i][0]) ci = i;
  const cap = $('caption');
  if (ci < 0 || !TL.captions[ci][2]) {
    cap.style.opacity = 0;
  } else {
    const [ct, step, text] = TL.captions[ci];
    const next = TL.captions[ci + 1];
    $('capstep').textContent = step; $('captxt').innerHTML = text;
    const pin = easeOut((t - ct) / .35);
    const pout = next ? easeInOut(clamp((t - (next[0] - .22)) / .22)) : 0;
    cap.style.opacity = pin * (1 - pout);
    cap.style.transform = `translate(-50%, -50%) translateY(${lerp(26, 0, pin) + 10 * pout}px) scale(${lerp(.96, 1, pin)})`;
  }

  // outro
  const show = (id, start, dur = .8) => { const p = easeOut(prog(t, start, dur)); $(id).style.opacity = p; $(id).style.transform = `translateY(${lerp(34, 0, p)}px)`; };
  $('outro').style.display = t < 15.6 ? 'none' : 'flex';
  show('oHead', 15.75);
  document.querySelectorAll('.chip').forEach((el, i) => { const p = backOut(prog(t, 16.2 + i * .12, .6)); el.style.opacity = clamp(prog(t, 16.2 + i * .12, .3)); el.style.transform = `translateY(${lerp(30, 0, p)}px) scale(${lerp(.85, 1, p)})`; });
  show('oLock', 16.95);
  const pc = backOut(prog(t, 17.3, .7));
  $('oCta').style.opacity = clamp(prog(t, 17.3, .35));
  const glow = t > 18.1 ? (Math.sin((t - 18.1) * Math.PI * 1.25 - Math.PI / 2) + 1) / 2 : 0;
  $('oCta').style.transform = `translateY(${lerp(30, 0, pc)}px) scale(${lerp(.8, 1, pc) * (1 + .035 * glow)})`;
  $('oCta').style.boxShadow = `0 20px ${50 + 30 * glow}px rgba(45,212,191,${.35 + .4 * glow})`;
};
</script>
</body>
</html>
